[workspace]
authors = ["Alex Nilles <nillesa2@wwu.edu>"]
channels = ["robostack-jazzy", "conda-forge"]
name = "ur3e-control"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# clean out old install files
clean = "rm -rf install/ log/ build/"
# build package: necessary if you change launch files or other configs
# don't forget to "source install/setup.sh" after building (control-sim and control-hw do this for you)
build = "colcon build --symlink-install"
# launch RVIz and driver for mock hardware (launch this before control-sim for viz without physics)
mock = "ros2 launch ur_robot_driver ur_control.launch.py ur_type:=ur3e robot_ip:=0.0.0.0 use_mock_hardware:=true launch_rviz:=true"
# launch gazebo for physics simulation (uses gazebo drivers for UR - don't need to run driver or mock)
sim = "ros2 launch ur_simulation_gz ur_sim_moveit.launch.py ur_type:=ur3e"
# launch driver for robot hardware (launch this before control-hw)
driver = "ros2 launch ur_robot_driver ur_control.launch.py ur_type:=ur3e robot_ip:=192.168.56.101 headless_mode:=true"
# launch minimal working example; runs src/ur_moveit_py/ur_moveit_py/move_arm.py
control-sim = { cmd = "bash -c 'source install/setup.bash && ros2 launch ur_moveit_py move_arm.launch.py'", depends-on = ["build"] }
control-hw = { cmd = "bash -c 'source install/setup.bash && ros2 launch ur_moveit_py move_arm.launch.py use_sim_time:=false'", depends-on = ["build"] }
# launch moveit GUI
moveit = "ros2 launch ur_moveit_config ur_moveit.launch.py ur_type:=ur3e"

[dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-ur-robot-driver = ">=3.7.0,<4"
ros-jazzy-ros2controlcli = ">=4.43.0,<5"
filelock = ">=3.24.3,<4"
ros-jazzy-ur-moveit-config = ">=3.7.0,<4"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-ros-gz = ">=1.0.19,<2"
colcon-common-extensions = ">=0.3.0,<0.4"
setuptools = "<70.0.0"
ros-jazzy-ur-description = ">=3.5.0,<4"
ros-jazzy-gz-sim-vendor = ">=0.0.9,<0.0.10"
ros-jazzy-ros2-control = ">=4.43.0,<5"
ros-jazzy-moveit = ">=2.12.4,<3"
ros-jazzy-gz-ros2-control = ">=1.2.17,<2"
ros-jazzy-ros2-controllers = ">=4.37.0,<5"
ros-jazzy-moveit-py = ">=2.12.4,<3"
ros-jazzy-ur-simulation-gz = ">=2.5.0,<3"
